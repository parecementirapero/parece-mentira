<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="papel" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="9"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.12  0 0 0 0.55 0"/>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2236"/><stop offset="1" stop-color="#0b0f1c"/></linearGradient></defs><rect x="10" y="10" width="880" height="380" rx="36" fill="url(#mk)" stroke="#3a4670" stroke-width="6" filter="url(#sombra)"/><rect x="40" y="40" width="820" height="60" rx="14" fill="#0a0e19"/><text x="450" y="84" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#9fb3e6" text-anchor="middle" letter-spacing="6">DURACIÓN</text><text x="60" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="40" fill="#e8ecf7">PARTIDO</text><text x="60" y="320" font-family="DejaVu Sans" font-weight="bold" font-size="40" fill="#ff8a7a">GUERRA</text></svg>