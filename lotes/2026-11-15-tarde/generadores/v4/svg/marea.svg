</filter>
<radialGradient id="ag" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#3aa0ff" stop-opacity="0.0"/><stop offset="0.7" stop-color="#3aa0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="450" cy="450" rx="420" ry="300" fill="url(#ag)"/><ellipse cx="450" cy="450" rx="400" ry="290" fill="none" stroke="#9ad2ff" stroke-width="4" stroke-dasharray="14 12" opacity="0.8"/></svg>