<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="par3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcc8"/><stop offset="1" stop-color="#b8a888"/></linearGradient><linearGradient id="hab3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#f2a85a"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#par3)"/><rect x="190" y="260" width="700" height="1560" fill="url(#hab3)"/><circle cx="540" cy="700" r="400" fill="#fff6d8" opacity="0.35" filter="url(#blur40)"/><rect x="150" y="220" width="780" height="40" fill="#f6f0e4"/><rect x="150" y="220" width="40" height="1700" fill="#f6f0e4"/><rect x="890" y="220" width="40" height="1700" fill="#d8ccb8"/><rect y="1820" width="1080" height="100" fill="#5a4030"/><rect width="1080" height="1920" fill="#888" filter="url(#grano)"/></svg>