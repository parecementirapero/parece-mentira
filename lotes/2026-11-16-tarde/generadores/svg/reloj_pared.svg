<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="esf" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#e8e0cc" stop-opacity="1"/></radialGradient></defs><circle cx="150" cy="156" r="140" fill="#000" opacity="0.35" filter="url(#blur8)"/><circle cx="150" cy="150" r="140" fill="#3a2a1a"/><circle cx="150" cy="150" r="118" fill="url(#esf)"/><rect x="146" y="40" width="8" height="22" fill="#2a2a30" transform="rotate(0 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(30 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(60 150 150)"/><rect x="146" y="40" width="8" height="22" fill="#2a2a30" transform="rotate(90 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(120 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(150 150 150)"/><rect x="146" y="40" width="8" height="22" fill="#2a2a30" transform="rotate(180 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(210 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(240 150 150)"/><rect x="146" y="40" width="8" height="22" fill="#2a2a30" transform="rotate(270 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(300 150 150)"/><rect x="146" y="40" width="8" height="12" fill="#2a2a30" transform="rotate(330 150 150)"/></svg>