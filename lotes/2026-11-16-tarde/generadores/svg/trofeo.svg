<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="oro" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.45" stop-color="#f2c040"/><stop offset="1" stop-color="#a8741a"/></linearGradient></defs><ellipse cx="200" cy="580" rx="150" ry="20" fill="#000" opacity="0.4" filter="url(#blur8)"/><rect x="90" y="500" width="220" height="70" rx="8" fill="#2a1a12"/><rect x="90" y="500" width="220" height="12" fill="#5a3a22"/><path d="M150 500 L170 400 L230 400 L250 500 Z" fill="url(#oro)"/><rect x="180" y="330" width="40" height="80" fill="url(#oro)"/><path d="M90 80 L310 80 Q310 300 200 340 Q90 300 90 80 Z" fill="url(#oro)"/><path d="M90 110 Q20 110 30 180 Q40 250 120 260" stroke="url(#oro)" stroke-width="22" fill="none"/><path d="M310 110 Q380 110 370 180 Q360 250 280 260" stroke="url(#oro)" stroke-width="22" fill="none"/><path d="M120 90 Q130 230 190 300" stroke="#fff" stroke-width="12" opacity="0.5" fill="none"/><ellipse cx="200" cy="82" rx="110" ry="16" fill="#a8741a"/></svg>