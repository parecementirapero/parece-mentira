<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" width="520" height="720"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="fon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3a1a22" stop-opacity="1"/><stop offset="1" stop-color="#12060a" stop-opacity="1"/></radialGradient><linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd0ff"/><stop offset="1" stop-color="#2a7ab8"/></linearGradient><linearGradient id="hue2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf3e2"/><stop offset="0.6" stop-color="#e7d6b4"/><stop offset="1" stop-color="#bfa77e"/></linearGradient><linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9ff"/><stop offset="1" stop-color="#9cc8ea"/></linearGradient></defs><path d="M150 0 L370 0 L370 380 Q420 480 380 600 Q260 690 140 600 Q100 480 150 380 Z" fill="url(#hue2)"/><path d="M120 560 Q260 690 400 560 Q400 640 260 700 Q120 640 120 560 Z" fill="url(#car)"/><path d="M170 0 L200 0 L200 380 Q160 480 170 580 Q140 480 170 380 Z" fill="#fff" opacity="0.4"/></svg>