<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="pt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2c29b"/><stop offset="1" stop-color="#b9805c"/></linearGradient><linearGradient id="cob2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#c87a32"/></linearGradient></defs><path d="M0 520 Q140 420 260 430 Q330 440 360 400 Q390 360 350 340 Q300 330 240 360 Q160 330 0 380 Z" fill="url(#pt)"/><path d="M240 360 Q300 300 360 300 Q392 302 380 330 Q350 350 300 370 Z" fill="url(#pt)"/><path d="M900 540 Q760 440 640 450 Q570 460 540 420 Q510 380 550 360 Q600 350 660 380 Q740 350 900 400 Z" fill="url(#pt)"/><path d="M370 330 L620 380" stroke="#d8d9dc" stroke-width="8" stroke-linecap="round"/><path d="M620 380 C700 400 760 300 900 320" stroke="url(#cob2)" stroke-width="6" fill="none"/><rect x="0" y="560" width="900" height="140" fill="#3a2410" opacity="0.0"/></svg>