<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="par" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a36"/><stop offset="1" stop-color="#0d141c"/></linearGradient><radialGradient id="luz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#cfe8ff" stop-opacity="0.85"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#par)"/><rect x="70" y="560" width="940" height="820" rx="26" fill="#3a4654"/><rect x="100" y="590" width="880" height="760" rx="14" fill="url(#luz)"/><rect x="100" y="590" width="880" height="760" rx="14" fill="#bfe0ff" opacity="0.15" filter="url(#blur20)"/><rect x="70" y="1380" width="940" height="40" rx="10" fill="#2a333e"/><rect y="1500" width="1080" height="420" fill="#141b22"/><rect width="1080" height="1920" fill="#888" filter="url(#grano)"/></svg>