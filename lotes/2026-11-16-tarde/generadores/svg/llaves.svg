<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250"><defs>
<filter id="grano" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs><circle cx="80" cy="90" r="58" fill="none" stroke="#e8b830" stroke-width="22"/><circle cx="80" cy="90" r="58" fill="none" stroke="#fff3b0" stroke-width="5" opacity="0.6"/><rect x="128" y="78" width="200" height="26" rx="6" fill="#e8b830"/><rect x="270" y="100" width="20" height="40" fill="#e8b830"/><rect x="300" y="100" width="18" height="28" fill="#e8b830"/><rect x="128" y="78" width="200" height="8" fill="#fff3b0" opacity="0.6"/><circle cx="110" cy="190" r="40" fill="none" stroke="#9aa6b2" stroke-width="16"/></svg>